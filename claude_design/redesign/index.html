<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lumen — Design System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Newsreader:ital,wght@1,400;1,500&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#06080f;color:#f1f5f9;font-family:'Plus Jakarta Sans',sans-serif}
.dc-artboard{background:#0a0f1e !important}
.artboard-iframe{width:100%;height:100%;border:0;display:block;background:#0a0f1e}
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { DesignCanvas, DCSection, DCArtboard } = window;

function Frame({ src }){
    return <iframe className="artboard-iframe" src={src} loading="lazy" />;
}

function App(){
    return (
        <DesignCanvas title="Lumen — Editorial Dark Mode" subtitle="Premium reading platform · 7 pages">
            <DCSection id="auth" title="Authentication">
                <DCArtboard id="auth" label="Login / Signup / OTP / Forgot" width={1280} height={820}>
                    <Frame src="auth.html" />
                </DCArtboard>
            </DCSection>

            <DCSection id="hub" title="The Hub">
                <DCArtboard id="dashboard" label="Dashboard" width={1280} height={900}>
                    <Frame src="dashboard.html" />
                </DCArtboard>
                <DCArtboard id="profile" label="My Profile" width={1280} height={900}>
                    <Frame src="profile.html" />
                </DCArtboard>
            </DCSection>

            <DCSection id="discover" title="Discover & Read">
                <DCArtboard id="feed" label="Feed (search + recommendations)" width={1280} height={900}>
                    <Frame src="feed.html" />
                </DCArtboard>
                <DCArtboard id="read" label="Read Blog" width={1280} height={900}>
                    <Frame src="read-blog.html" />
                </DCArtboard>
                <DCArtboard id="author" label="Author Page" width={1280} height={900}>
                    <Frame src="author.html" />
                </DCArtboard>
            </DCSection>

            <DCSection id="create" title="Create">
                <DCArtboard id="editor" label="Create Blog (focused editor)" width={1280} height={900}>
                    <Frame src="create-blog.html" />
                </DCArtboard>
            </DCSection>
        </DesignCanvas>
    );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
