<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #333;
        }
        .dashboard-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 3rem;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }
        h1 {
            color: #2d3748;
            margin-top: 0;
            font-size: 2rem;
            font-weight: 700;
        }
        p {
            color: #4a5568;
            margin-bottom: 2.5rem;
            font-size: 1.1rem;
            line-height: 1.5;
        }
        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .btn {
            display: inline-block;
            padding: 1rem 1.5rem;
            border-radius: 8px;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }
        .btn-primary {
            background: #4a90e2;
            color: white;
            box-shadow: 0 4px 14px rgba(74, 144, 226, 0.4);
        }
        .btn-primary:hover {
            background: #357abd;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(74, 144, 226, 0.6);
        }
        .btn-secondary {
            background: #edf2f7;
            color: #4a5568;
        }
        .btn-secondary:hover {
            background: #e2e8f0;
            transform: translateY(-2px);
        }
        .logout {
            margin-top: 2rem;
            font-size: 0.9rem;
        }
        .logout a {
            color: #e53e3e;
            text-decoration: none;
            font-weight: 600;
        }
        .logout a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <h1>Welcome Back!</h1>
        <p>What would you like to do today? Choose an option below to get started.</p>
        <div class="action-buttons">
            <a href="/api/blogs/create-ui" class="btn btn-primary">Write a New Blog</a>
            <a href="/api/blogs/feed-ui" class="btn btn-secondary">Explore AI Feed & Search</a>
            <a href="/api/profile" class="btn btn-secondary">My Profile</a>
        </div>
        <div class="logout">
            <a href="/api/auth/logout">Logout</a>
        </div>
    </div>
</body>
</html>
