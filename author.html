<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Author — GitWrite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Newsreader:ital,wght@1,400;1,500&display=swap" rel="stylesheet">
<style>
:root{
    --bg:#0e0c0b; --surface:#1a1714; --surface-2:#221d19;
    --border:#2e2a27; --border-bright:#3d3630;
    --text:#d4cdc7; --text-strong:#ece5df; --muted:#7a736d; --subtle:#5a534d;
    --accent:#e8845c; --accent-soft:rgba(232,132,92,.10); --accent-press:#d97249;
    --gold:#c9a96e;
    --danger:#e05c5c;
    --shadow-md:0 8px 24px rgba(0,0,0,.35); --shadow-glow:0 8px 32px rgba(232,132,92,.2);
    --r-sm:6px; --r:8px; --r-md:12px; --r-pill:999px;
    --ease:cubic-bezier(.4,0,.2,1); --dur:200ms;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text-strong);font-family:'Plus Jakarta Sans',sans-serif;-webkit-font-smoothing:antialiased;line-height:1.5;min-height:100vh}
a{color:inherit;text-decoration:none} button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}

.nav{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:1rem 2.5rem;background:rgba(14,12,11,.92);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:.65rem;font-weight:700;font-size:1.05rem}
.nav-brand-mark{width:28px;height:28px;border-radius:var(--r);background:var(--accent);display:grid;place-items:center;font-weight:800;font-size:.9rem;color:#fff}
.nav-back{display:inline-flex;align-items:center;gap:.4rem;font-size:.875rem;color:var(--muted);padding:.5rem .95rem;border-radius:var(--r-pill);transition:all var(--dur) var(--ease)}
.nav-back:hover{color:var(--text-strong);background:var(--surface-2)}
.nav-avatar{width:36px;height:36px;border-radius:50%;background:var(--accent);display:grid;place-items:center;font-weight:700;font-size:.85rem;color:#fff}

/* Loading / error */
.loading-state{text-align:center;padding:6rem 2rem;color:var(--muted)}
.spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 1.5rem}
@keyframes spin{to{transform:rotate(360deg)}}
.empty-state{text-align:center;padding:4rem 2rem;color:var(--muted)}

/* Hero */
.hero{max-width:1080px;margin:0 auto;padding:5rem 2.5rem 2.5rem;text-align:center}
.avatar-xl{width:120px;height:120px;border-radius:50%;background:var(--accent);display:grid;place-items:center;margin:0 auto 1.5rem;font-size:3rem;font-weight:700;color:#fff;box-shadow:var(--shadow-glow);overflow:hidden;border:3px solid var(--bg);outline:1px solid var(--border-bright)}
.avatar-xl img{width:100%;height:100%;object-fit:cover}
.author-name{font-size:2.6rem;font-weight:700;letter-spacing:-.025em;margin-bottom:.4rem}
.author-since{font-size:.85rem;color:var(--muted);margin-top:.3rem}
.author-stats{display:flex;justify-content:center;gap:3rem;margin-top:1rem;margin-bottom:1.5rem;flex-wrap:wrap}
.stat{display:flex;flex-direction:column;align-items:center;gap:.25rem}
.stat .num{font-size:1.6rem;font-weight:700;letter-spacing:-.015em;font-variant-numeric:tabular-nums}
.stat .lbl{font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}

.follow-cluster{display:flex;justify-content:center;gap:.5rem}
.follow-pill{padding:.7rem 1.8rem;border-radius:var(--r-pill);background:var(--accent);color:#fff;font-weight:600;font-size:.92rem;transition:all var(--dur) var(--ease)}
.follow-pill:hover{transform:translateY(-1px);box-shadow:var(--shadow-glow);background:var(--accent-press)}
.follow-pill.unfollow{background:transparent;border:1px solid var(--border-bright);color:var(--muted)}
.follow-pill.unfollow:hover{color:var(--danger);border-color:rgba(224,92,92,.5);background:rgba(224,92,92,.08)}

/* Tabs */
.tabs-wrap{max-width:1080px;margin:0 auto;padding:0 2.5rem;border-bottom:1px solid var(--border);display:flex;gap:.4rem;justify-content:center}
.tab{padding:1rem 1.4rem;font-size:.9rem;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;position:relative;top:1px;transition:color var(--dur) var(--ease)}
.tab.active{color:var(--text-strong);border-bottom-color:var(--accent)}

/* Story list */
.list{max-width:760px;margin:0 auto;padding:3rem 2rem 6rem}
.story{display:block;padding:2rem 0;border-bottom:1px solid var(--border);transition:padding var(--dur) var(--ease);cursor:pointer}
.story:hover{padding-left:.5rem}
.story h3{font-size:1.5rem;font-weight:700;letter-spacing:-.018em;line-height:1.25;margin-bottom:.6rem;color:var(--text-strong)}
.story p{color:var(--muted);font-size:1rem;line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:.85rem}
.story-meta{display:flex;align-items:center;gap:1rem;font-size:.8rem;color:var(--subtle)}

.pagination{display:flex;justify-content:center;gap:.4rem;padding:2.5rem 0}
.pg-btn{min-width:36px;height:36px;padding:0 .85rem;display:inline-grid;place-items:center;border-radius:var(--r-pill);background:var(--surface-2);border:1px solid var(--border);color:var(--text);font-size:.85rem;font-weight:500;transition:all var(--dur) var(--ease)}
.pg-btn:hover:not(:disabled){background:var(--border);color:var(--text-strong)}
.pg-btn.active{background:var(--accent);color:#fff;border-color:transparent}
.pg-btn:disabled{opacity:.4;cursor:not-allowed}

.fade-in{animation:fadeIn .5s ease-out}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

@media(max-width:760px){.nav{padding:1rem 1.25rem}.hero,.tabs-wrap,.list{padding-left:1.25rem;padding-right:1.25rem}.hero{padding-top:3rem}}
</style>
</head>
<body>
<nav class="nav">
    <a href="/api/dashboard" class="nav-brand"><div class="nav-brand-mark">L</div><span>GitWrite</span></a>
    <a class="nav-back" href="/api/blogs/feed-ui"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg> Back to feed</a>
    <a class="nav-avatar" href="/api/profile">M</a>
</nav>

<div class="loading-state" id="loadingState">
    <div class="spinner"></div>
    <p>Loading author profile…</p>
</div>

<div id="authorPage" style="display:none" class="fade-in">
    <div class="hero">
        <div class="avatar-xl" id="authorAvatar"></div>
        <h1 class="author-name" id="authorName"></h1>
        <div class="author-since" id="authorSince"></div>
        <div class="author-stats" id="authorStats"></div>
        <div id="followSection" style="display:none">
            <div class="follow-cluster">
                <button class="follow-pill" id="followBtn" onclick="toggleFollow()"><span id="followBtnText">Follow</span></button>
            </div>
        </div>
    </div>

    <div class="tabs-wrap">
        <button class="tab active">Stories</button>
        <button class="tab">About</button>
    </div>

    <main class="list" id="blogList"></main>
    <div class="pagination" id="pagination"></div>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const authorId = params.get('id');
    let currentPage = 1;
    let isFollowing = false;

    async function getCurrentUserId() {
        try {
            const res = await fetch('/api/auth/me', { credentials: 'include' });
            if (!res.ok) return null;
            const data = await res.json();
            return data.id;
        } catch { return null; }
    }

    async function loadFollowState(currentUserId) {
        const res = await fetch(`/api/follow/${authorId}/stats`);
        const stats = await res.json();

        const statsEl = document.getElementById('authorStats');
        const firstStat = statsEl.querySelector('.stat');
        const firstHtml = firstStat ? firstStat.outerHTML : '';
        statsEl.innerHTML = `${firstHtml}
            <div class="stat"><div class="num">${stats.followers}</div><div class="lbl">Followers</div></div>
            <div class="stat"><div class="num">${stats.following}</div><div class="lbl">Following</div></div>`;

        if (!currentUserId || currentUserId === parseInt(authorId)) return;

        const checkRes = await fetch(`/api/follow/${authorId}/is-following`, { credentials: 'include' });
        if (checkRes.ok) {
            const data = await checkRes.json();
            isFollowing = data.following;
        }

        updateFollowButton();
        document.getElementById('followSection').style.display = 'block';
    }

    function updateFollowButton() {
        const btn = document.getElementById('followBtn');
        const text = document.getElementById('followBtnText');
        if (isFollowing) {
            btn.className = 'follow-pill unfollow';
            text.textContent = 'Following';
        } else {
            btn.className = 'follow-pill';
            text.textContent = 'Follow';
        }
    }

    btn_hover: {
        document.getElementById('followBtn').addEventListener('mouseenter', () => {
            if (isFollowing) document.getElementById('followBtnText').textContent = 'Unfollow';
        });
        document.getElementById('followBtn').addEventListener('mouseleave', () => {
            if (isFollowing) document.getElementById('followBtnText').textContent = 'Following';
        });
    }

    async function toggleFollow() {
        const method = isFollowing ? 'DELETE' : 'POST';
        const res = await fetch(`/api/follow/${authorId}`, { method, credentials: 'include' });
        if (res.ok) {
            isFollowing = !isFollowing;
            updateFollowButton();
            const statsRes = await fetch(`/api/follow/${authorId}/stats`);
            const stats = await statsRes.json();
            const statsEl = document.getElementById('authorStats');
            const firstStat = statsEl.querySelector('.stat');
            const firstHtml = firstStat ? firstStat.outerHTML : '';
            statsEl.innerHTML = `${firstHtml}
                <div class="stat"><div class="num">${stats.followers}</div><div class="lbl">Followers</div></div>
                <div class="stat"><div class="num">${stats.following}</div><div class="lbl">Following</div></div>`;
        }
    }

    async function loadAuthorPage(page = 1) {
        if (!authorId) {
            document.getElementById('loadingState').innerHTML = '<div class="empty-state">No author specified</div>';
            return;
        }
        try {
            const res = await fetch(`/api/blogs/author/${authorId}?page=${page}&limit=10`);
            if (!res.ok) {
                document.getElementById('loadingState').innerHTML = '<div class="empty-state">Author not found</div>';
                return;
            }
            const data = await res.json();
            currentPage = page;

            const author = data.author;
            const avatarEl = document.getElementById('authorAvatar');
            if (author.profile_picture) {
                avatarEl.innerHTML = `<img src="${author.profile_picture}" alt="${escapeHtml(author.username)}">`;
            } else {
                avatarEl.textContent = author.username.charAt(0).toUpperCase();
            }
            document.getElementById('authorName').textContent = author.username;
            document.getElementById('authorSince').textContent = 'Member since ' + new Date(author.created_at).toLocaleDateString('en-US', { year: 'numeric', month: 'long' });
            document.getElementById('authorStats').innerHTML = `
                <div class="stat"><div class="num">${data.pagination.total}</div><div class="lbl">Stories</div></div>`;
            document.title = author.username + ' — GitWrite';

            const currentUserId = await getCurrentUserId();
            await loadFollowState(currentUserId);

            const list = document.getElementById('blogList');
            if (data.blogs.length === 0) {
                list.innerHTML = '<div class="empty-state">No published blogs yet</div>';
            } else {
                list.innerHTML = data.blogs.map(b => `
                    <article class="story" onclick="window.location.href='/api/blogs/read-ui?id=${b.blog_id}'">
                        <h3>${escapeHtml(b.title)}</h3>
                        <p>${escapeHtml((b.content || '').replace(/<[^>]*>/g, '').substring(0, 200))}${(b.content || '').length > 200 ? '…' : ''}</p>
                        <div class="story-meta">
                            <span>${new Date(b.created_at).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' })}</span>
                            <span>·</span>
                            <span>❤ ${b.likes_count}</span>
                            <span>💬 ${b.comments_count}</span>
                        </div>
                    </article>
                `).join('');
            }

            renderPagination(data.pagination);
            document.getElementById('loadingState').style.display = 'none';
            document.getElementById('authorPage').style.display = 'block';
        } catch (err) {
            console.error('Error loading author:', err);
            document.getElementById('loadingState').innerHTML = '<div class="empty-state">Failed to load author profile</div>';
        }
    }

    function renderPagination(p) {
        const el = document.getElementById('pagination');
        if (p.total_pages <= 1) { el.innerHTML = ''; return; }
        let html = `<button class="pg-btn" ${p.page <= 1 ? 'disabled' : ''} onclick="loadAuthorPage(${p.page - 1})">← Prev</button>`;
        for (let i = 1; i <= p.total_pages; i++) {
            html += `<button class="pg-btn ${i === p.page ? 'active' : ''}" onclick="loadAuthorPage(${i})">${i}</button>`;
        }
        html += `<button class="pg-btn" ${p.page >= p.total_pages ? 'disabled' : ''} onclick="loadAuthorPage(${p.page + 1})">Next →</button>`;
        el.innerHTML = html;
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    loadAuthorPage();
</script>
</body>
</html>
